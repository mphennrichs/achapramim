name: Build and Push Docker Images

# Push na main -> builda backend+frontend, publica no GHCR com tag :sha-<commit>
# e avisa o fogolab pra deployar essa versão exata. Este repo é agnóstico ao
# deployer (não conhece Komodo) — quem reage ao dispatch é o fogolab
# (.github/workflows/on-image-updated.yml de lá).
#
# Pré-requisito no lado do fogolab (ver CLAUDE.md de lá): "achapramim" precisa
# estar na allowlist do on-image-updated.yml, e o stack precisa existir
# (Komodo Stack + secrets no Infisical em /achapramim) antes do primeiro
# dispatch ter efeito.

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  OWNER: mphennrichs

jobs:
  vars:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: sha
        run: echo "sha=sha-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

  build-backend:
    needs: [vars]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/achapramim-backend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/achapramim-backend:${{ needs.vars.outputs.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

  build-frontend:
    needs: [vars]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend/app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.OWNER }}/achapramim-frontend:latest
            ${{ env.REGISTRY }}/${{ env.OWNER }}/achapramim-frontend:${{ needs.vars.outputs.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

  # Após ambas as imagens publicadas, avisa o fogolab com a TAG exata pra ele
  # fazer o pin-by-SHA no compose do stack achapramim e disparar o redeploy via
  # Komodo. Requer que "achapramim" já esteja na allowlist de
  # fogolab/.github/workflows/on-image-updated.yml (não está por padrão).
  notify-deploy:
    needs: [vars, build-backend, build-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Notify fogolab to deploy this version
        env:
          DISPATCH_TOKEN: ${{ secrets.FOGOLAB_DISPATCH_TOKEN }}
          TAG: ${{ needs.vars.outputs.sha }}
        run: |
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ env.OWNER }}/fogolab/dispatches \
            -d "{\"event_type\":\"image-updated\",\"client_payload\":{\"stack\":\"achapramim\",\"tag\":\"${TAG}\"}}"
